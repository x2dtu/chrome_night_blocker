<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocked · Night Blocker</title>
    <link rel="stylesheet" href="block.css" />
  </head>
  <body>
    <main>
      <div class="icon"><img id="favicon" alt="" width="64" height="64" /><span id="badge" class="badge" hidden>18+</span></div>
      <h1 id="site">This site</h1>
      <div class="chip"><span class="dot"></span><span id="chip"></span></div>
      <p id="message" class="message" hidden></p>
      <p id="streak" class="streak" hidden></p>
      <section id="why" class="why" hidden>
        <h2>Why you're seeing this</h2>
        <ul id="reasons"></ul>
      </section>

      <div id="hard-controls" class="controls" hidden>
        <button id="leave-primary" type="button" class="primary">Go to a new tab</button>
      </div>

      <div id="soft-controls" class="controls" hidden>
        <div id="dots" class="dots"></div>
        <p id="stats" class="stats"></p>
        <p id="limits" class="muted small"></p>
        <button id="continue" type="button" class="primary" disabled>Continue</button>
        <button id="leave" type="button" class="text">Go to a new tab</button>
      </div>

      <p id="returning" class="muted" hidden>Taking you back…</p>
      <p id="error" class="error" role="alert"></p>
    </main>
    <script src="block.js"></script>
  </body>
</html>
