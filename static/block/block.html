<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocked · Night Blocker</title>
    <link rel="stylesheet" href="block.css" />
  </head>
  <body>
    <main>
      <p id="set-name" class="set-name"></p>
      <h1 id="site">This site</h1>
      <p id="headline"></p>
      <p id="message" class="message"></p>
      <ul id="reasons" class="reasons"></ul>
      <p id="streak" class="muted"></p>
      <section id="soft" hidden>
        <p id="soft-status"></p>
        <p id="soft-limits" class="muted"></p>
        <button id="continue" type="button" disabled>Continue</button>
      </section>
      <p id="error" class="error"></p>
      <button id="new-tab" type="button" class="secondary">Go to a new tab</button>
    </main>
    <script src="block.js"></script>
  </body>
</html>
